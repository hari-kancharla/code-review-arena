evidence_summary: Upstream https://github.com/more-itertools/more-itertools/commit/edb3346f835ca917efbfda5e2d6664ab952da369
  (Reversing an empty numeric_range raises IndexError) is a historical repair whose parent
  is the buggy tree. The added or rewritten regression coverage in tests/test_more.py fails
  on that parent and passes at the fix.
why_buggy_behavior_is_wrong: numeric_range.__reversed__ always indexed the last element to
  build the reversed span, so an empty range raised IndexError instead of yielding no values.
fixed_tests_that_exercise_it: The case runs `pytest tests/test_more.py -q` (`tests/test_more.py`).
  That command fails on the buggy tree and passes after `reference.patch`. The whole module
  is used rather than a single node so mutants elsewhere in the ground-truth file can be killed.
why_ground_truth_is_supported: 'The declared buggy logic (more_itertools/more.py in the after/
  tree) is exactly the hunk the historical fix rewrites: __reversed__ called _get_by_index(-1)
  unconditionally, which raises on an empty range. An empty numeric_range must reverse to
  an empty iterator. The added tests pin that defective behaviour.'
admission_status: accepted
