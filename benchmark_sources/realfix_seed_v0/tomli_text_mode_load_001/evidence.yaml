evidence_summary: Upstream https://github.com/hukkin/tomli/pull/175 (load on a text-mode file
  raises AttributeError) is a historical repair whose parent is the buggy tree. The added
  or rewritten regression coverage in tests/test_misc.py fails on that parent and passes at
  the fix.
why_buggy_behavior_is_wrong: tomli.load called .decode() on the result of fp.read(), so a
  file opened in text mode raised AttributeError instead of a TypeError telling the caller
  to use binary mode.
fixed_tests_that_exercise_it: The case runs `pytest tests/test_misc.py -q` (`tests/test_misc.py`).
  That command fails on the buggy tree and passes after `reference.patch`. The whole module
  is used rather than a single node so mutants elsewhere in the ground-truth file can be killed.
why_ground_truth_is_supported: 'The declared buggy logic (src/tomli/_parser.py in the after/
  tree) is exactly the hunk the historical fix rewrites: load decoded fp.read() without checking
  that the result was bytes, so a text-mode file raised AttributeError from str.decode. The
  added tests pin that defective behaviour.'
admission_status: accepted
