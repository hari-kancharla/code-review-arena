schema_version: '1'
pack:
  version: '1'
  name: realfix_seed_v0
case:
  id: more_itertools_chunked_even_001
  title: chunked_even online buffer size is too small
  category: correctness
  severity: medium
  stack:
  - python
  description: The online path of chunked_even sized its lookahead buffer as n*(n-1)-1,
    which is too small for some n and produced uneven chunks from a streaming iterable.
source_paths:
- more_itertools
tests_root: tests
ground_truth:
  bugs:
  - id: bug-1
    summary: _chunked_even_online used maxbuf = n*(n-1)-1, which does not buffer enough
      elements to keep chunk lengths even for every n.
    files:
    - path: more_itertools/more.py
      line_ranges:
      - start: 3928
        end: 3929
    concepts:
    - lookahead buffer
    - even chunks
    must_mention:
    - insufficient lookahead
    acceptable_fix_keywords:
    - larger buffer
    - n plus
execution:
  run_tests: true
  test_command: pytest tests/test_more.py -q
  timeout_seconds: 180
  docker_image: arena-realfix-seed:0
validation:
  patch_required: true
  tests_required: true
