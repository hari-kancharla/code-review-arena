evidence_summary: Upstream https://github.com/pypa/packaging/pull/1246 (Nested extra markers
  are not canonicalized) is a historical repair whose parent is the buggy tree. The added
  or rewritten regression coverage in tests/test_markers.py fails on that parent and passes
  at the fix.
why_buggy_behavior_is_wrong: Extra canonicalization only inspected a top-level comparison
  tuple, so an extra nested inside a parenthesized group kept its original spelling and failed
  to match the canonical extra name.
fixed_tests_that_exercise_it: The case runs `pytest tests/test_markers.py -q` (`tests/test_markers.py`).
  That command fails on the buggy tree and passes after `reference.patch`. The whole module
  is used rather than a single node so mutants elsewhere in the ground-truth file can be killed.
why_ground_truth_is_supported: 'The declared buggy logic (src/packaging/markers.py in the
  after/ tree) is exactly the hunk the historical fix rewrites: _normalize_extras returned
  immediately unless its argument was a tuple, so a nested list (a parenthesized group) was
  left unchanged and extras inside it were never canonicalized. The added tests pin that defective
  behaviour.'
admission_status: accepted
