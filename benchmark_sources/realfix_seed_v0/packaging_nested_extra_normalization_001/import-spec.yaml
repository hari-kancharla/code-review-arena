schema_version: '1'
pack:
  version: '1'
  name: realfix_seed_v0
case:
  id: packaging_nested_extra_normalization_001
  title: Nested extra markers are not canonicalized
  category: correctness
  severity: medium
  stack:
  - python
  description: Extra canonicalization only inspected a top-level comparison tuple,
    so an extra nested inside a parenthesized group kept its original spelling and
    failed to match the canonical extra name.
source_paths:
- src/packaging
tests_root: tests
ground_truth:
  bugs:
  - id: bug-1
    summary: _normalize_extras returned immediately unless its argument was a tuple,
      so a nested list (a parenthesized group) was left unchanged and extras inside
      it were never canonicalized.
    files:
    - path: src/packaging/markers.py
      line_ranges:
      - start: 163
        end: 166
    concepts:
    - nested markers
    - extra canonicalization
    must_mention:
    - parenthesized group
    acceptable_fix_keywords:
    - walk nested lists
    - recurse
execution:
  run_tests: true
  test_command: pytest tests/test_markers.py -q
  timeout_seconds: 120
  docker_image: arena-realfix-seed:0
validation:
  patch_required: true
  tests_required: true
