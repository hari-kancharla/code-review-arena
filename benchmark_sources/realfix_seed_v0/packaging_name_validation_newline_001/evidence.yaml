category: security
evidence_summary: >
  PR #925 ("Correct regex for metadata 'name' format") replaces the "$" anchor in
  the core-metadata Name validation pattern with "\Z". Python's re module treats
  "$" as matching at the end of the string OR immediately before a trailing
  newline, so the buggy pattern accepted names such as "hi\n". "\Z" matches only
  at the true end of the string.
why_buggy_behavior_is_wrong: >
  canonicalize_name(name, validate=True) must raise InvalidName for any string that
  is not a legal core-metadata Name. A trailing newline is not legal, yet the buggy
  pattern matched it, so validation silently passed and the newline could be carried
  into RFC822-style metadata fields where a line break changes the meaning of the
  record. This is the standard Python "$ versus \Z" validation-bypass defect.
fixed_tests_that_exercise_it: >
  tests/test_utils.py::test_canonicalize_name_invalid is parametrized at the fixed
  commit over "hi\n", "\nhi", "h\ni", "hi\r", "\rhi" and "h\ri" and asserts that each
  raises InvalidName under validate=True. The trailing-newline parameters fail on the
  buggy tree and pass on the fixed tree. The case runs the whole tests/test_utils.py
  module so the suite also exercises the rest of src/packaging/utils.py, which is what
  gives the case its mutation-kill evidence.
why_ground_truth_is_supported: >
  The declared buggy logic (src/packaging/utils.py line 38 in the after/ tree) is
  exactly the "$"-anchored _validate_regex that PR #925 replaces, and the PR's added
  parameters pin the trailing-newline acceptance the anchor caused.
admission_status: accepted
