schema_version: "1"
pack:
  version: "1"
  name: realfix_seed_v0
case:
  id: packaging_name_validation_newline_001
  title: Name validation accepts a name with a trailing newline
  category: security
  severity: medium
  stack: [python]
  description: >
    The regular expression that validates a core-metadata Name was anchored with
    "$", which in Python matches at the end of the string OR immediately before a
    final newline. A name such as "hi\n" therefore passed validation, so
    canonicalize_name(..., validate=True) accepted it instead of raising
    InvalidName, and a newline could be carried into RFC822-style metadata fields.
source_paths: [src/packaging]
tests_root: tests
ground_truth:
  bugs:
    - id: bug-1
      summary: >
        The Name validation pattern ends with "$", which Python's re module also
        matches just before a trailing newline, so a name containing a trailing
        newline was accepted as valid. The pattern must be anchored so that only
        the true end of the string terminates a match.
      files:
        - path: src/packaging/utils.py
          line_ranges:
            - start: 38
              end: 38
      concepts: ["regular expression", "end of string"]
      must_mention: ["trailing newline"]
      acceptable_fix_keywords: ["fullmatch", "end of string", "anchor"]
execution:
  run_tests: true
  test_command: "pytest tests/test_utils.py -q"
  timeout_seconds: 120
  docker_image: arena-realfix-seed:0
validation:
  patch_required: true
  tests_required: true
