evidence_summary: Upstream https://github.com/kjd/idna/commit/b0d8f3c45d83 (Unknown codepoint
  next to a joiner leaks ValueError) is a historical repair whose parent is the buggy tree.
  The added or rewritten regression coverage in tests/test_idna.py fails on that parent and
  passes at the fix.
why_buggy_behavior_is_wrong: check_label asked valid_contextj whether a CONTEXTJ codepoint
  was allowed, and that helper raised ValueError when an adjacent codepoint was missing from
  Unicode data, so encode/decode leaked ValueError instead of IDNAError.
fixed_tests_that_exercise_it: The case runs `pytest tests/test_idna.py -q` (`tests/test_idna.py`).
  That command fails on the buggy tree and passes after `reference.patch`. The whole module
  is used rather than a single node so mutants elsewhere in the ground-truth file can be killed.
why_ground_truth_is_supported: 'The declared buggy logic (idna/core.py in the after/ tree)
  is exactly the hunk the historical fix rewrites: valid_contextj raised ValueError for a
  codepoint absent from Unicode data. That failure escaped check_label instead of becoming
  IDNAError. The added tests pin that defective behaviour.'
admission_status: accepted
