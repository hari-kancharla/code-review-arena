evidence_summary: Upstream https://github.com/more-itertools/more-itertools/issues/1057 (windowed
  accepts a zero-width window) is a historical repair whose parent is the buggy tree. The
  added or rewritten regression coverage in tests/test_more.py fails on that parent and passes
  at the fix.
why_buggy_behavior_is_wrong: windowed treated a window size of zero as a special case that
  yielded one empty tuple, instead of rejecting non-positive sizes the way a sliding window
  of elements requires.
fixed_tests_that_exercise_it: The case runs `pytest tests/test_more.py -q` (`tests/test_more.py`).
  That command fails on the buggy tree and passes after `reference.patch`. The whole module
  is used rather than a single node so mutants elsewhere in the ground-truth file can be killed.
why_ground_truth_is_supported: 'The declared buggy logic (more_itertools/more.py in the after/
  tree) is exactly the hunk the historical fix rewrites: windowed rejected only negative n
  and yielded a single empty tuple when n was zero. A sliding window width must be strictly
  positive. The added tests pin that defective behaviour.'
admission_status: accepted
