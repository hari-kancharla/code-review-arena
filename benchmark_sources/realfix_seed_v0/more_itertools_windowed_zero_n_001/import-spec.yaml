schema_version: '1'
pack:
  version: '1'
  name: realfix_seed_v0
case:
  id: more_itertools_windowed_zero_n_001
  title: windowed accepts a zero-width window
  category: correctness
  severity: low
  stack:
  - python
  description: windowed treated a window size of zero as a special case that yielded
    one empty tuple, instead of rejecting non-positive sizes the way a sliding window
    of elements requires.
source_paths:
- more_itertools
tests_root: tests
ground_truth:
  bugs:
  - id: bug-1
    summary: windowed rejected only negative n and yielded a single empty tuple when
      n was zero. A sliding window width must be strictly positive.
    files:
    - path: more_itertools/more.py
      line_ranges:
      - start: 1048
        end: 1052
    concepts:
    - window width
    - non-positive size
    must_mention:
    - zero-width
    acceptable_fix_keywords:
    - strictly positive
    - reject zero
execution:
  run_tests: true
  test_command: pytest tests/test_more.py -q
  timeout_seconds: 180
  docker_image: arena-realfix-seed:0
validation:
  patch_required: true
  tests_required: true
