schema_version: '1'
pack:
  version: '1'
  name: realfix_seed_v0
case:
  id: packaging_normalized_name_double_hyphen_001
  title: is_normalized_name accepts collapsed double hyphens
  category: correctness
  severity: medium
  stack:
  - python
  description: The normalized-name pattern used a negative lookahead that failed to
    reject a name such as a--b, so is_normalized_name returned true for a spelling
    that canonicalize_name would still rewrite.
source_paths:
- src/packaging
tests_root: tests
ground_truth:
  bugs:
  - id: bug-1
    summary: The normalized-name regular expression used a negative lookahead that
      still matched names containing adjacent hyphens, so is_normalized_name accepted
      spellings that are not canonical.
    files:
    - path: src/packaging/utils.py
      line_ranges:
      - start: 61
        end: 61
    concepts:
    - canonical name
    - adjacent hyphens
    must_mention:
    - adjacent hyphens
    acceptable_fix_keywords:
    - hyphen-separated groups
execution:
  run_tests: true
  test_command: pytest tests/test_utils.py -q
  timeout_seconds: 120
  docker_image: arena-realfix-seed:0
validation:
  patch_required: true
  tests_required: true
