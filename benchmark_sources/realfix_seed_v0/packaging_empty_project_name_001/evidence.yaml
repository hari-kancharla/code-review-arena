evidence_summary: Upstream https://github.com/pypa/packaging/pull/1305 (Wheel and sdist parsers
  accept an empty project name) is a historical repair whose parent is the buggy tree. The
  added or rewritten regression coverage in tests/test_utils.py fails on that parent and passes
  at the fix.
why_buggy_behavior_is_wrong: The wheel project-name pattern used a star quantifier and the
  sdist parser never checked the name side of the last dash, so filenames such as -1.0-py3-none-any.whl
  and -1.0.tar.gz parsed as a nameless distribution instead of being rejected.
fixed_tests_that_exercise_it: The case runs `pytest tests/test_utils.py -q` (`tests/test_utils.py`).
  That command fails on the buggy tree and passes after `reference.patch`. The whole module
  is used rather than a single node so mutants elsewhere in the ground-truth file can be killed.
why_ground_truth_is_supported: 'The declared buggy logic (src/packaging/utils.py in the after/
  tree) is exactly the hunk the historical fix rewrites: The wheel name pattern allowed zero
  characters and parse_sdist_filename did not reject an empty name_part after rpartition,
  so a leading dash was accepted as a distribution with no project name. The added tests pin
  that defective behaviour.'
admission_status: accepted
