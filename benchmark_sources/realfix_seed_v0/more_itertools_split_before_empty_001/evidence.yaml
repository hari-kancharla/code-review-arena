evidence_summary: Upstream https://github.com/more-itertools/more-itertools/commit/2e81a562fbaccc996c19c069090a53f52ec894fe
  (split_before yields an empty chunk for an empty input) is a historical repair whose parent
  is the buggy tree. The added or rewritten regression coverage in tests/test_more.py fails
  on that parent and passes at the fix.
why_buggy_behavior_is_wrong: split_before always yielded its leftover buffer after the loop,
  so an empty iterable produced one empty list instead of no chunks.
fixed_tests_that_exercise_it: The case runs `pytest tests/test_more.py -q` (`tests/test_more.py`).
  That command fails on the buggy tree and passes after `reference.patch`. The whole module
  is used rather than a single node so mutants elsewhere in the ground-truth file can be killed.
why_ground_truth_is_supported: 'The declared buggy logic (more_itertools/more.py in the after/
  tree) is exactly the hunk the historical fix rewrites: After consuming the iterable, split_before
  yielded the buffer even when it was empty, so an empty input produced a single empty chunk.
  The added tests pin that defective behaviour.'
admission_status: accepted
