evidence_summary: Upstream https://github.com/pypa/packaging/pull/1093 (Infinity sentinels
  compare as unordered against themselves) is a historical repair whose parent is the buggy
  tree. The added or rewritten regression coverage in tests/test_structures.py fails on that
  parent and passes at the fix.
why_buggy_behavior_is_wrong: InfinityType and NegativeInfinityType implemented ordering against
  every other object, including the same sentinel, so Infinity < Infinity was true and Infinity
  <= Infinity was false. A total order over the version sentinels must treat a sentinel as
  equal to itself.
fixed_tests_that_exercise_it: The case runs `pytest tests/test_structures.py -q` (`tests/test_structures.py`).
  That command fails on the buggy tree and passes after `reference.patch`. The whole module
  is used rather than a single node so mutants elsewhere in the ground-truth file can be killed.
why_ground_truth_is_supported: 'The declared buggy logic (src/packaging/_structures.py in
  the after/ tree) is exactly the hunk the historical fix rewrites: InfinityType.__le__ always
  returned False and __gt__ always True, and equality used isinstance rather than object identity,
  so a sentinel did not compare equal-or-ordered to itself. Each comparison with the same
  object must follow identity. The added tests pin that defective behaviour.'
admission_status: accepted
