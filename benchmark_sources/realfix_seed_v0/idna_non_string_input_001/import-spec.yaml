schema_version: '1'
pack:
  version: '1'
  name: realfix_seed_v0
case:
  id: idna_non_string_input_001
  title: encode and decode leak TypeError for non-bytes-like input
  category: correctness
  severity: medium
  stack:
  - python
  description: idna.encode and idna.decode caught only UnicodeDecodeError when coercing
    a non-str argument, so values such as int or None raised a raw TypeError from
    str(..., 'ascii') instead of the documented IDNAError.
source_paths:
- idna
tests_root: tests
ground_truth:
  bugs:
  - id: bug-1
    summary: The coercion of a non-str argument caught UnicodeDecodeError only, so
      TypeError from str(..., 'ascii') escaped. Both encode and decode must wrap that
      failure as IDNAError.
    files:
    - path: idna/core.py
      line_ranges:
      - start: 379
        end: 379
      - start: 414
        end: 418
    concepts:
    - exception wrapping
    - coercion failure
    must_mention:
    - raw TypeError
    acceptable_fix_keywords:
    - wrap the coercion
execution:
  run_tests: true
  test_command: pytest tests/test_idna.py -q
  timeout_seconds: 120
  docker_image: arena-realfix-seed:0
validation:
  patch_required: true
  tests_required: true
