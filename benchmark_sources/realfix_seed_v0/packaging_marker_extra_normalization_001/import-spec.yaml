schema_version: "1"
pack:
  version: "1"
  name: realfix_seed_v0
case:
  id: packaging_marker_extra_normalization_001
  title: Only the first environment marker has its extra normalized
  category: correctness
  severity: medium
  stack: [python]
  description: >
    Extra normalization indexed the parsed marker list at position zero instead of
    walking it, so only the first marker in an expression was canonicalized. In
    'python_version >= "3" and extra == "mariadb_connector"' the extra kept its
    underscore, so it no longer compared equal to the canonical "mariadb-connector"
    and the optional dependency was silently skipped.
source_paths: [src/packaging]
tests_root: tests
ground_truth:
  bugs:
    - id: bug-1
      summary: >
        _normalize_extra_values inspected and rewrote only results[0], so an extra
        appearing anywhere other than the first position of a marker expression was
        left un-normalized. Every element of the marker list must be normalized,
        not just the first.
      files:
        - path: src/packaging/markers.py
          line_ranges:
            - start: 129
              end: 138
      concepts: ["marker list", "canonicalization"]
      must_mention: ["only the first"]
      acceptable_fix_keywords: ["every marker", "iterate", "all markers", "each element"]
execution:
  run_tests: true
  test_command: "pytest tests/test_markers.py tests/test_requirements.py -q"
  timeout_seconds: 120
  docker_image: arena-realfix-seed:0
validation:
  patch_required: true
  tests_required: true
