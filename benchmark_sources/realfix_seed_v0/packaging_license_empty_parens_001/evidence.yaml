evidence_summary: Upstream https://github.com/pypa/packaging/pull/879 (Empty parentheses are
  accepted as a license expression) is a historical repair whose parent is the buggy tree.
  The added or rewritten regression coverage in tests/test_metadata.py fails on that parent
  and passes at the fix.
why_buggy_behavior_is_wrong: canonicalize_license_expression translated tokens into a Python
  expression and evaluated it, so the empty group '()' evaluated as valid instead of being
  rejected as an invalid license expression.
fixed_tests_that_exercise_it: The case runs `pytest tests/test_metadata.py -q` (`tests/test_metadata.py`).
  That command fails on the buggy tree and passes after `reference.patch`. The whole module
  is used rather than a single node so mutants elsewhere in the ground-truth file can be killed.
why_ground_truth_is_supported: 'The declared buggy logic (src/packaging/licenses/__init__.py
  in the after/ tree) is exactly the hunk the historical fix rewrites: Empty parenthesis pairs
  were not detected, and the translated expression was eval''d rather than compiled, so ''()''
  produced a successful empty evaluation instead of InvalidLicenseExpression. The added tests
  pin that defective behaviour.'
admission_status: accepted
