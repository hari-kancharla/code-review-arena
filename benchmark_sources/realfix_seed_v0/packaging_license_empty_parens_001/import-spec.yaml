schema_version: '1'
pack:
  version: '1'
  name: realfix_seed_v0
case:
  id: packaging_license_empty_parens_001
  title: Empty parentheses are accepted as a license expression
  category: correctness
  severity: medium
  stack:
  - python
  description: canonicalize_license_expression translated tokens into a Python expression
    and evaluated it, so the empty group '()' evaluated as valid instead of being
    rejected as an invalid license expression.
source_paths:
- src/packaging
tests_root: tests
ground_truth:
  bugs:
  - id: bug-1
    summary: Empty parenthesis pairs were not detected, and the translated expression
      was eval'd rather than compiled, so '()' produced a successful empty evaluation
      instead of InvalidLicenseExpression.
    files:
    - path: src/packaging/licenses/__init__.py
      line_ranges:
      - start: 83
        end: 85
      - start: 100
        end: 104
    concepts:
    - SPDX grammar
    - empty group
    must_mention:
    - empty group
    acceptable_fix_keywords:
    - reject empty group
execution:
  run_tests: true
  test_command: pytest tests/test_metadata.py -q
  timeout_seconds: 120
  docker_image: arena-realfix-seed:0
validation:
  patch_required: true
  tests_required: true
