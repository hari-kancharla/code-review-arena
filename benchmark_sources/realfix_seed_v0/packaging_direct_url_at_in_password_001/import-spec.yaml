schema_version: '1'
pack:
  version: '1'
  name: realfix_seed_v0
case:
  id: packaging_direct_url_at_in_password_001
  title: Direct URL auth stripping splits on the first at-sign
  category: security
  severity: medium
  stack:
  - python
  description: Stripping userinfo from a direct URL netloc used split on the first
    at-sign, so a password that itself contained '@' left part of the secret in the
    published URL.
source_paths:
- src/packaging
tests_root: tests
ground_truth:
  bugs:
  - id: bug-1
    summary: _strip_auth_from_netloc split the netloc on the first '@', so a password
      containing that character was only partially removed and the remainder stayed
      in the URL that DirectUrl.to_dict publishes.
    files:
    - path: src/packaging/direct_url.py
      line_ranges:
      - start: 86
        end: 86
    concepts:
    - userinfo stripping
    - netloc split
    must_mention:
    - first at-sign
    acceptable_fix_keywords:
    - rightmost separator
execution:
  run_tests: true
  test_command: pytest tests/test_direct_url.py -q
  timeout_seconds: 120
  docker_image: arena-realfix-seed:0
validation:
  patch_required: true
  tests_required: true
