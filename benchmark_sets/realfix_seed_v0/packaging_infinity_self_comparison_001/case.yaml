category: correctness
description: InfinityType and NegativeInfinityType implemented ordering against every
  other object, including the same sentinel, so Infinity < Infinity was true and Infinity
  <= Infinity was false. A total order over the version sentinels must treat a sentinel
  as equal to itself.
