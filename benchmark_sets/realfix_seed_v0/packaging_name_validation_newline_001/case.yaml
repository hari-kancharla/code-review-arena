    - end of string
    files:
    - line_ranges:
      - end: 38
        start: 38
      path: src/packaging/utils.py
    id: bug-1
    must_mention:
    - trailing newline
    summary: 'The Name validation pattern ends with "$", which Python''s re module
      also matches just before a trailing newline, so a name containing a trailing
      newline was accepted as valid. The pattern must be anchored so that only the
      true end of the string terminates a match.

      '
