category: security
description: 'The regular expression that validates a core-metadata Name was anchored
  with "$", which in Python matches at the end of the string OR immediately before
  a final newline. A name such as "hi\n" therefore passed validation, so canonicalize_name(...,
  validate=True) accepted it instead of raising InvalidName, and a newline could be
  carried into RFC822-style metadata fields.

  '
