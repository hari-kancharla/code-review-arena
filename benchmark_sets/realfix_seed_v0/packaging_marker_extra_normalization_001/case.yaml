category: correctness
description: 'Extra normalization indexed the parsed marker list at position zero
  instead of walking it, so only the first marker in an expression was canonicalized.
  In ''python_version >= "3" and extra == "mariadb_connector"'' the extra kept its
  underscore, so it no longer compared equal to the canonical "mariadb-connector"
  and the optional dependency was silently skipped.

  '
