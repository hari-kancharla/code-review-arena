version: 2
# Monthly, grouped updates: one batched pull request per ecosystem per month
# instead of an individual PR per dependency every week. Keeps dependencies
# current for supply-chain hygiene without the weekly noise. Security updates
# (vulnerability alerts) are a separate repository setting and are unaffected.
#
# Majors are split into their own PR per ecosystem. A single breaking major
# otherwise holds the whole batch red and blocks the routine security-relevant
# patch and minor bumps riding along with it: in Aug 2026 a tailwindcss 3 -> 4
# major (which needs the @tailwindcss/postcss migration) kept the dashboard PR
# failing while next/postcss/sharp advisories sat unpatched inside it.
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      python-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: npm
    directory: "/dashboard"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      dashboard:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      dashboard-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-major:
        patterns: ["*"]
        update-types: ["major"]
